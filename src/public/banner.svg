<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400">
  <defs>
    <!-- Background gradient: deep dark navy -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080e1a"/>
      <stop offset="100%" style="stop-color:#0d1b2e"/>
    </linearGradient>

    <!-- Gold accent gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d4b896"/>
      <stop offset="50%" style="stop-color:#f0d9b5"/>
      <stop offset="100%" style="stop-color:#d4b896"/>
    </linearGradient>

    <!-- Glow filter for logo -->
    <filter id="logoGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft glow for accent lines -->
    <filter id="lineGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip path for the whole banner -->
    <clipPath id="bannerClip">
      <rect width="900" height="400" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#bannerClip)">

    <!-- Background -->
    <rect width="900" height="400" fill="url(#bgGrad)"/>

    <!-- Subtle grid pattern -->
    <g opacity="0.04" stroke="#d4b896" stroke-width="0.5">
      <!-- Vertical lines -->
      <line x1="100" y1="0" x2="100" y2="400"/>
      <line x1="200" y1="0" x2="200" y2="400"/>
      <line x1="300" y1="0" x2="300" y2="400"/>
      <line x1="400" y1="0" x2="400" y2="400"/>
      <line x1="500" y1="0" x2="500" y2="400"/>
      <line x1="600" y1="0" x2="600" y2="400"/>
      <line x1="700" y1="0" x2="700" y2="400"/>
      <line x1="800" y1="0" x2="800" y2="400"/>
      <!-- Horizontal lines -->
      <line x1="0" y1="80" x2="900" y2="80"/>
      <line x1="0" y1="160" x2="900" y2="160"/>
      <line x1="0" y1="240" x2="900" y2="240"/>
      <line x1="0" y1="320" x2="900" y2="320"/>
    </g>

    <!-- ER Diagram nodes (decorative, right side) -->
    <!-- Table node 1 -->
    <g opacity="0.18" transform="translate(570, 60)">
      <rect width="140" height="110" rx="6" fill="none" stroke="#d4b896" stroke-width="1.2"/>
      <line x1="0" y1="30" x2="140" y2="30" stroke="#d4b896" stroke-width="1"/>
      <rect x="8" y="8" width="50" height="14" rx="2" fill="#d4b896" opacity="0.4"/>
      <rect x="8" y="40" width="90" height="8" rx="2" fill="#d4b896" opacity="0.25"/>
      <rect x="8" y="56" width="70" height="8" rx="2" fill="#d4b896" opacity="0.2"/>
      <rect x="8" y="72" width="80" height="8" rx="2" fill="#d4b896" opacity="0.15"/>
      <rect x="8" y="88" width="60" height="8" rx="2" fill="#d4b896" opacity="0.15"/>
    </g>

    <!-- Table node 2 -->
    <g opacity="0.18" transform="translate(745, 130)">
      <rect width="130" height="90" rx="6" fill="none" stroke="#d4b896" stroke-width="1.2"/>
      <line x1="0" y1="30" x2="130" y2="30" stroke="#d4b896" stroke-width="1"/>
      <rect x="8" y="8" width="60" height="14" rx="2" fill="#d4b896" opacity="0.4"/>
      <rect x="8" y="40" width="80" height="8" rx="2" fill="#d4b896" opacity="0.25"/>
      <rect x="8" y="56" width="60" height="8" rx="2" fill="#d4b896" opacity="0.2"/>
      <rect x="8" y="72" width="75" height="8" rx="2" fill="#d4b896" opacity="0.15"/>
    </g>

    <!-- Table node 3 -->
    <g opacity="0.18" transform="translate(600, 240)">
      <rect width="150" height="120" rx="6" fill="none" stroke="#d4b896" stroke-width="1.2"/>
      <line x1="0" y1="30" x2="150" y2="30" stroke="#d4b896" stroke-width="1"/>
      <rect x="8" y="8" width="70" height="14" rx="2" fill="#d4b896" opacity="0.4"/>
      <rect x="8" y="40" width="100" height="8" rx="2" fill="#d4b896" opacity="0.25"/>
      <rect x="8" y="56" width="80" height="8" rx="2" fill="#d4b896" opacity="0.2"/>
      <rect x="8" y="72" width="90" height="8" rx="2" fill="#d4b896" opacity="0.15"/>
      <rect x="8" y="88" width="65" height="8" rx="2" fill="#d4b896" opacity="0.15"/>
      <rect x="8" y="104" width="75" height="8" rx="2" fill="#d4b896" opacity="0.1"/>
    </g>

    <!-- Connector lines between nodes -->
    <g opacity="0.14" stroke="#d4b896" stroke-width="1" fill="none" filter="url(#lineGlow)">
      <!-- Node 1 to Node 2 -->
      <line x1="710" y1="115" x2="750" y2="145"/>
      <!-- Node 1 to Node 3 -->
      <line x1="640" y1="170" x2="650" y2="240"/>
      <!-- Cardinality markers -->
      <line x1="706" y1="112" x2="714" y2="118"/>
      <line x1="706" y1="118" x2="714" y2="112"/>
      <circle cx="750" cy="145" r="3" fill="#d4b896"/>
    </g>

    <!-- Top thin gold accent line -->
    <rect x="0" y="0" width="900" height="2.5" fill="url(#goldGrad)" opacity="0.7"/>

    <!-- Bottom thin gold accent line -->
    <rect x="0" y="397.5" width="900" height="2.5" fill="url(#goldGrad)" opacity="0.35"/>

    <!-- Left vertical accent -->
    <rect x="60" y="0" width="1" height="400" fill="#d4b896" opacity="0.08"/>

    <!-- Logo icon — HF mark, scaled up (centered left area) -->
    <g transform="translate(78, 148) scale(5.5)" filter="url(#logoGlow)">
      <path d="M 8 24 V 8 M 8 16 H 18 M 18 24 V 8 H 24 M 18 16 H 22"
            fill="none"
            stroke="url(#goldGrad)"
            stroke-width="3.2"
            stroke-linecap="round"
            stroke-linejoin="round"/>
    </g>

    <!-- Thin divider line between logo and text -->
    <line x1="248" y1="110" x2="248" y2="290" stroke="#d4b896" stroke-width="0.8" opacity="0.25"/>

    <!-- Main title -->
    <text x="278" y="195"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="64"
          font-weight="700"
          letter-spacing="-1"
          fill="url(#goldGrad)">HFModelo</text>

    <!-- Tagline -->
    <text x="280" y="232"
          font-family="'Courier New', Courier, monospace"
          font-size="14.5"
          letter-spacing="2.5"
          fill="#d4b896"
          opacity="0.65">TEXT  →  ER DIAGRAM</text>

    <!-- Decorative dash before tagline left -->
    <line x1="280" y1="258" x2="330" y2="258" stroke="#d4b896" stroke-width="0.8" opacity="0.3"/>

    <!-- Description text -->
    <text x="280" y="278"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="15"
          fill="#a89880"
          letter-spacing="0.3">Modelagem de banco de dados com Inteligência Artificial</text>

    <!-- Badges row -->
    <!-- Badge: Open Source -->
    <g transform="translate(280, 305)">
      <rect width="88" height="22" rx="4" fill="#d4b896" opacity="0.1" stroke="#d4b896" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="44" y="15.5" font-family="'Courier New', monospace" font-size="10" fill="#d4b896" opacity="0.8" text-anchor="middle" letter-spacing="1">AGPL-3.0</text>
    </g>
    <!-- Badge: Local -->
    <g transform="translate(378, 305)">
      <rect width="80" height="22" rx="4" fill="#d4b896" opacity="0.1" stroke="#d4b896" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="40" y="15.5" font-family="'Courier New', monospace" font-size="10" fill="#d4b896" opacity="0.8" text-anchor="middle" letter-spacing="1">100% LOCAL</text>
    </g>
    <!-- Badge: React Flow -->
    <g transform="translate(468, 305)">
      <rect width="100" height="22" rx="4" fill="#d4b896" opacity="0.1" stroke="#d4b896" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="50" y="15.5" font-family="'Courier New', monospace" font-size="10" fill="#d4b896" opacity="0.8" text-anchor="middle" letter-spacing="1">REACT FLOW</text>
    </g>
    <!-- Badge: TypeScript -->
    <g transform="translate(578, 305)">
      <rect width="96" height="22" rx="4" fill="#d4b896" opacity="0.1" stroke="#d4b896" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="48" y="15.5" font-family="'Courier New', monospace" font-size="10" fill="#d4b896" opacity="0.8" text-anchor="middle" letter-spacing="1">TYPESCRIPT</text>
    </g>

    <!-- Corner ornament top-left -->
    <g opacity="0.2" stroke="#d4b896" stroke-width="1" fill="none">
      <line x1="20" y1="20" x2="48" y2="20"/>
      <line x1="20" y1="20" x2="20" y2="48"/>
    </g>
    <!-- Corner ornament bottom-right -->
    <g opacity="0.2" stroke="#d4b896" stroke-width="1" fill="none">
      <line x1="880" y1="380" x2="852" y2="380"/>
      <line x1="880" y1="380" x2="880" y2="352"/>
    </g>

  </g>
</svg>
